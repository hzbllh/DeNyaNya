<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>De Nya Nya - Kasir</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #fff;
      padding-bottom: 240px;
    }
    header {
      background: #1a1a2e;
      padding: 16px;
      text-align: center;
      border-bottom: 3px solid #e94560;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.5rem; color: #e94560; }
    header p { font-size: 0.85rem; color: #aaa; margin-top: 4px; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    .product {
      background: #16213e;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }
    .product:active { transform: scale(0.96); }
    .product h3 { font-size: 0.95rem; margin-bottom: 6px; line-height: 1.3; }
    .product .price {
      color: #e94560;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    .product button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
      font-weight: 600;
    }

    .cart-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      border-top: 3px solid #e94560;
      padding: 12px 16px 20px;
      z-index: 200;
      max-height: 48vh;
      overflow-y: auto;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .cart-header h2 { font-size: 1.1rem; }
    .total { font-size: 1.4rem; font-weight: bold; color: #e94560; }
    .cart-items { margin-bottom: 12px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 0.95rem;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-controls button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #e94560;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .actions button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
    }
    .btn-cash { background: #0f9b58; }
    .btn-qr { background: #3b82f6; }
    .btn-clear { background: #555; grid-column: span 2; }
    .btn-history {
      background: #333;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      color: #ccc;
      font-size: 0.9rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      margin: 40px auto;
    }
    .modal h2 { margin-bottom: 16px; color: #e94560; }
    .sale-item {
      background: #16213e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .close-btn {
      background: #e94560;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 1rem;
    }
    .empty { text-align: center; color: #888; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>De Nya Nya</h1>
    <p>Kasir • Makanan & Minuman</p>
  </header>

  <div class="products" id="products"></div>

  <div class="cart-panel">
    <div class="cart-header">
      <h2>Cart</h2>
      <div class="total">RM <span id="total">0.00</span></div>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="empty">Cart kosong</div>
    </div>
    <div class="actions">
      <button class="btn-cash" onclick="checkout('Cash')">Bayar Cash</button>
      <button class="btn-qr" onclick="checkout('QR')">Bayar QR</button>
      <button class="btn-clear" onclick="clearCart()">Kosongkan Cart</button>
    </div>
    <button class="btn-history" onclick="showHistory()">Sejarah Jualan</button>
  </div>

  <div class="modal" id="historyModal">
    <div class="modal-content">
      <h2>Sejarah Jualan</h2>
      <div id="historyList"></div>
      <button class="close-btn" onclick="closeHistory()">Tutup</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Nasi Lemak", price: 5.00 },
      { id: 2, name: "Mee Goreng", price: 6.00 },
      { id: 3, name: "Roti Canai", price: 2.50 },
      { id: 4, name: "Nasi Ayam", price: 7.00 },
      { id: 5, name: "Teh Tarik", price: 2.50 },
      { id: 6, name: "Kopi O", price: 2.00 },
      { id: 7, name: "Nescafe", price: 3.00 },
      { id: 8, name: "Air Mineral", price: 1.50 },
      { id: 9, name: "Milo", price: 3.00 },
      { id: 10, name: "Kuih", price: 1.50 }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product">
          <h3>${p.name}</h3>
          <div class="price">RM ${p.price.toFixed(2)}</div>
          <button onclick="addToCart(${p.id})">+ Tambah</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCart();
    }

    function updateCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('total');

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty">Cart kosong</div>';
        totalEl.textContent = '0.00';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>RM ${item.price.toFixed(2)} × ${item.qty}</small>
            </div>
            <div class="qty-controls">
              <button onclick="changeQty(${item.id}, -1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      totalEl.textContent = total.toFixed(2);
    }

    function clearCart() {
      if (cart.length === 0) return;
      if (confirm('Kosongkan cart?')) {
        cart = [];
        updateCart();
      }
    }

    function checkout(method) {
      if (cart.length === 0) {
        alert('Cart masih kosong!');
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const now = new Date();
      const sale = {
        id: Date.now(),
        date: now.toLocaleString('ms-MY'),
        method: method,
        items: [...cart],
        total: total
      };

      let sales = JSON.parse(localStorage.getItem('denyanya_sales') || '[]');
      sales.unshift(sale);
      localStorage.setItem('denyanya_sales', JSON.stringify(sales));

      alert(`Jualan berjaya!\n\nKaedah: ${method}\nJumlah: RM ${total.toFixed(2)}`);
      cart = [];
      updateCart();
    }

    function showHistory() {
      const sales = JSON.parse(localStorage.getItem('denyanya_sales') || '[]');
      const list = document.getElementById('historyList');

      if (sales.length === 0) {
        list.innerHTML = '<div class="empty">Belum ada jualan</div>';
      } else {
        list.innerHTML = sales.map(sale => `
          <div class="sale-item">
            <strong>${sale.date}</strong><br>
            ${sale.method} • RM ${sale.total.toFixed(2)}<br>
            <small>${sale.items.map(i => i.name + ' x' + i.qty).join(', ')}</small>
          </div>
        `).join('');
      }
      document.getElementById('historyModal').style.display = 'block';
    }

    function closeHistory() {
      document.getElementById('historyModal').style.display = 'none';
    }

    // Mula
    renderProducts();
    updateCart();
  </script>
</body>
</html>
