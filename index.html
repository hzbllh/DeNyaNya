<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E67E22">
<link rel="manifest" href="manifest.json">
<title>De Nya Nya</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FFF8F0;color:#1a1a1a;padding-bottom:270px}
header{background:#fff;padding:14px 16px 12px;text-align:center;border-bottom:3px solid #E67E22;position:sticky;top:0;z-index:100}
header img{height:52px;margin-bottom:6px;object-fit:contain}
header h1{font-size:1.45rem;font-weight:800;letter-spacing:-0.5px}
header h1 span{color:#E67E22}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.product{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;border:1px solid #f0e6d8}
.product h3{font-size:.95rem;margin-bottom:6px}
.product .price{color:#E67E22;font-weight:700;font-size:1.15rem;margin-bottom:12px}
.product button{background:#E67E22;color:#fff;border:none;padding:10px;border-radius:12px;width:100%;font-weight:600}
.cart-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #E67E22;padding:14px 16px 20px;z-index:200;max-height:48vh;overflow-y:auto}
.cart-header{display:flex;justify-content:space-between;margin-bottom:10px}
.total{font-size:1.4rem;font-weight:800;color:#E67E22}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0e6d8;font-size:.92rem}
.qty-controls{display:flex;align-items:center;gap:12px}
.qty-controls button{width:34px;height:34px;border-radius:50%;border:none;background:#E67E22;color:#fff;font-size:1.15rem;font-weight:bold}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.actions button{padding:14px;border:none;border-radius:14px;font-size:1rem;font-weight:600;color:#fff}
.btn-cash{background:#27ae60}.btn-qr{background:#2980b9}
.btn-clear{background:#95a5a6;grid-column:span 2;margin-top:4px}
.bottom-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bottom-btns button{padding:12px;border:none;border-radius:12px;font-size:.88rem;background:#f5f0e8;color:#555}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;padding:12px;overflow-y:auto}
.modal-content{background:#fff;border-radius:20px;padding:20px 16px;max-width:400px;margin:16px auto;text-align:center}
.modal h2{margin-bottom:12px;color:#E67E22;font-size:1.25rem}
.modal .amount{font-size:1.6rem;font-weight:800;margin:4px 0 12px}
.display-box{background:#1a1a1a;color:#fff;border-radius:14px;padding:16px;font-size:2rem;font-weight:700;margin-bottom:12px;letter-spacing:1px}
.change-box{background:#e8f8ef;border-radius:12px;padding:12px;margin-bottom:12px}
.change-box .value{font-size:1.4rem;font-weight:800;color:#27ae60}
.numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.numpad button{padding:16px 0;font-size:1.35rem;font-weight:700;border:none;border-radius:12px;background:#f4f4f4;color:#1a1a1a}
.numpad button:active{background:#e0e0e0;transform:scale(.97)}
.numpad .btn-zero{grid-column:span 1}
.numpad .btn-clear-num{background:#ffebee;color:#e74c3c}
.numpad .btn-ok{background:#27ae60;color:#fff}
.btn-confirm{background:#27ae60;color:#fff;border:none;padding:15px;width:100%;border-radius:14px;font-size:1.05rem;font-weight:600}
.btn-cancel{background:#f0f0f0;color:#555;border:none;padding:13px;width:100%;border-radius:14px;margin-top:8px}
.qr-image{width:200px;height:200px;margin:8px auto 16px;display:flex;align-items:center;justify-content:center;border:2px dashed #ddd;border-radius:16px}
.qr-image img{width:180px;height:180px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.summary-item{background:#FFF8F0;border-radius:12px;padding:10px 8px;text-align:center}
.summary-item .label{font-size:.68rem;color:#888}
.summary-item .value{font-size:.95rem;font-weight:700;color:#E67E22;margin-top:2px}
.summary-item.cash .value{color:#27ae60}.summary-item.qr .value{color:#2980b9}
.summary-item.full{grid-column:span 2}
.date-folder{background:#fff;border:1px solid #f0e6d8;border-radius:12px;margin-bottom:10px;overflow:hidden}
.date-header{padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer;background:#FFF8F0}
.date-header:active{background:#f5eode}
.date-header .arrow{transition:transform .2s;font-size:1.1rem}
.date-header.open .arrow{transform:rotate(90deg)}
.date-sales{display:none;padding:8px 12px 12px}
.date-sales.show{display:block}
.sale-item{background:#fafafa;padding:12px;border-radius:10px;margin-bottom:8px;font-size:.88rem;text-align:left;border:1px solid #eee}
.sale-item .top{display:flex;justify-content:space-between;gap:8px}
.btn-del{background:#e74c3c;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:.78rem}
.product-edit-item{background:#FFF8F0;padding:12px;border-radius:12px;margin-bottom:8px;font-size:.9rem;text-align:left}
.product-edit-item .top{display:flex;justify-content:space-between;gap:8px}
.close-btn,.save-btn{background:#E67E22;color:#fff;border:none;padding:14px;width:100%;border-radius:14px;margin-top:12px;font-weight:600}
.save-btn{background:#27ae60}
.empty{text-align:center;color:#999;padding:24px}
.form-group{margin-bottom:12px;text-align:left}
.form-group label{display:block;font-size:.85rem;color:#666;margin-bottom:5px}
.form-group input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:1rem}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header>
  <img src="https://raw.githubusercontent.com/hzbllh/DeNyaNya/refs/heads/main/IMG-20250730-WA0008.jpg" alt="Logo">
  <h1>DE <span>NYA</span> NYA.</h1>
</header>

<div class="products" id="products"></div>

<div class="cart-panel">
  <div class="cart-header"><h2>Cart</h2><div class="total">RM <span id="total">0.00</span></div></div>
  <div class="cart-items" id="cart-items"><div class="empty">Cart kosong</div></div>
  <div class="actions">
    <button class="btn-cash" onclick="startCashPayment()">Bayar Cash</button>
    <button class="btn-qr" onclick="startQRPayment()">Bayar QR</button>
    <button class="btn-clear" onclick="clearCart()">Kosongkan Cart</button>
  </div>
  <div class="bottom-btns">
    <button onclick="showHistory()">Sejarah Jualan</button>
    <button onclick="showProductManager()">Urus Produk</button>
  </div>
</div>

<!-- Cash Modal + Number Pad -->
<div class="modal" id="cashModal">
  <div class="modal-content">
    <h2>Bayar Cash</h2>
    <div class="amount">Jumlah: RM <span id="cashTotal">0.00</span></div>
    <div class="display-box" id="cashDisplay">0</div>
    <div class="change-box" id="changeBox" style="display:none">
      <div style="font-size:.8rem;color:#666">Baki perlu diberi</div>
      <div class="value" id="changeAmount">RM 0.00</div>
    </div>
    <div class="numpad">
      <button onclick="numpadPress('1')">1</button>
      <button onclick="numpadPress('2')">2</button>
      <button onclick="numpadPress('3')">3</button>
      <button onclick="numpadPress('4')">4</button>
      <button onclick="numpadPress('5')">5</button>
      <button onclick="numpadPress('6')">6</button>
      <button onclick="numpadPress('7')">7</button>
      <button onclick="numpadPress('8')">8</button>
      <button onclick="numpadPress('9')">9</button>
      <button class="btn-clear-num" onclick="numpadPress('C')">C</button>
      <button onclick="numpadPress('0')">0</button>
      <button onclick="numpadPress('.')">.</button>
    </div>
    <button class="btn-confirm" onclick="confirmCashPayment()">Sahkan Pembayaran</button>
    <button class="btn-cancel" onclick="closeModal('cashModal')">Batal</button>
  </div>
</div>

<!-- QR Modal -->
<div class="modal" id="qrModal">
  <div class="modal-content">
    <h2>Bayar QR</h2>
    <div class="amount">Jumlah: RM <span id="qrTotal">0.00</span></div>
    <div class="qr-image"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=DeNyaNya" alt="QR"></div>
    <button class="btn-confirm" onclick="confirmQRPayment()">Sahkan Pembayaran</button>
    <button class="btn-cancel" onclick="closeModal('qrModal')">Batal</button>
  </div>
</div>

<!-- History Modal -->
<div class="modal" id="historyModal">
  <div class="modal-content" style="text-align:left">
    <h2>Sejarah Jualan</h2>
    <div class="summary-grid">
      <div class="summary-item"><div class="label">Hari Ini</div><div class="value" id="sumToday">RM 0.00</div></div>
      <div class="summary-item"><div class="label">Bulan Ini</div><div class="value" id="sumMonth">RM 0.00</div></div>
      <div class="summary-item cash"><div class="label">Cash Hari Ini</div><div class="value" id="sumCashToday">RM 0.00</div></div>
      <div class="summary-item qr"><div class="label">QR Hari Ini</div><div class="value" id="sumQRToday">RM 0.00</div></div>
      <div class="summary-item cash"><div class="label">Total Cash</div><div class="value" id="sumCash">RM 0.00</div></div>
      <div class="summary-item qr"><div class="label">Total QR</div><div class="value" id="sumQR">RM 0.00</div></div>
      <div class="summary-item full"><div class="label">Keseluruhan</div><div class="value" id="sumAll">RM 0.00</div></div>
    </div>
    <div id="historyList"></div>
    <button class="btn-del" style="width:100%;margin-top:12px;padding:12px" onclick="clearAllSales()">Padam Semua</button>
    <button class="close-btn" onclick="closeModal('historyModal')">Tutup</button>
  </div>
</div>

<!-- Product Modal -->
<div class="modal" id="productModal">
  <div class="modal-content" style="text-align:left">
    <h2>Urus Produk</h2>
    <div class="form-group"><label>Nama</label><input type="text" id="prodName"></div>
    <div class="form-group"><label>Harga (RM)</label><input type="number" id="prodPrice" step="0.50"></div>
    <div class="form-actions">
      <button class="save-btn" onclick="saveProduct()">Simpan</button>
      <button class="close-btn" style="margin-top:0" onclick="closeModal('productModal')">Tutup</button>
    </div>
    <div id="productList" style="margin-top:16px"></div>
  </div>
</div>

<script>
const defaultProducts=[{id:1,name:"Nasi Lemak",price:5},{id:2,name:"Mee Goreng",price:6},{id:3,name:"Roti Canai",price:2.5},{id:4,name:"Nasi Ayam",price:7},{id:5,name:"Teh Tarik",price:2.5},{id:6,name:"Kopi O",price:2},{id:7,name:"Nescafe",price:3},{id:8,name:"Air Mineral",price:1.5},{id:9,name:"Milo",price:3},{id:10,name:"Kuih",price:1.5}];
let products=JSON.parse(localStorage.getItem('denyanya_products')||'null');
if(!products||!products.length)products=defaultProducts;
let cart=[],editingId=null,currentTotal=0,cashInput='';

function renderProducts(){
  let html='';
  for(let i=0;i<products.length;i++){
    let p=products[i];
    html+='<div class="product"><h3>'+p.name+'</h3><div class="price">RM '+p.price.toFixed(2)+'</div><button onclick="addToCart('+p.id+')">+ Tambah</button></div>';
  }
  document.getElementById('products').innerHTML=html;
}
function addToCart(id){
  let p=products.find(x=>x.id===id);if(!p)return;
  let e=cart.find(i=>i.id===id);
  if(e)e.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
  updateCart();
}
function changeQty(id,d){
  let i=cart.find(x=>x.id===id);if(!i)return;
  i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);
  updateCart();
}
function updateCart(){
  let c=document.getElementById('cart-items'),t=document.getElementById('total');
  if(!cart.length){c.innerHTML='<div class="empty">Cart kosong</div>';t.textContent='0.00';return;}
  let total=0,html='';
  for(let i=0;i<cart.length;i++){
    let item=cart[i];total+=item.price*item.qty;
    html+='<div class="cart-item"><div><strong>'+item.name+'</strong><br><small>RM '+item.price.toFixed(2)+' x '+item.qty+'</small></div><div class="qty-controls"><button onclick="changeQty('+item.id+',-1)">-</button><span>'+item.qty+'</span><button onclick="changeQty('+item.id+',1)">+</button></div></div>';
  }
  c.innerHTML=html;t.textContent=total.toFixed(2);currentTotal=total;
}
function clearCart(){if(cart.length&&confirm('Kosongkan cart?')){cart=[];updateCart();}}

function startCashPayment(){
  if(!cart.length)return alert('Cart kosong!');
  currentTotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('cashTotal').textContent=currentTotal.toFixed(2);
  cashInput='';
  document.getElementById('cashDisplay').textContent='0';
  document.getElementById('changeBox').style.display='none';
  document.getElementById('cashModal').style.display='block';
}
function numpadPress(key){
  if(key==='C'){cashInput='';}
  else if(key==='.'){if(cashInput.indexOf('.')===-1)cashInput+=(cashInput===''?'0.':'.');}
  else{if(cashInput==='0')cashInput=key;else cashInput+=key;}
  if(cashInput.indexOf('.')>-1){
    let parts=cashInput.split('.');
    if(parts[1].length>2)cashInput=parts[0]+'.'+parts[1].substring(0,2);
  }
  document.getElementById('cashDisplay').textContent=cashInput||'0';
  updateChange();
}
function updateChange(){
  let r=parseFloat(cashInput)||0,ch=r-currentTotal;
  let box=document.getElementById('changeBox'),amt=document.getElementById('changeAmount');
  if(r>0){
    box.style.display='block';
    amt.textContent=ch>=0?'RM '+ch.toFixed(2):'Kurang RM '+Math.abs(ch).toFixed(2);
    amt.style.color=ch>=0?'#27ae60':'#e74c3c';
  }else box.style.display='none';
}
function confirmCashPayment(){
  let r=parseFloat(cashInput)||0;
  if(r<currentTotal)return alert('Wang tidak cukup!');
  saveSale('Cash',r);
  closeModal('cashModal');
}
function startQRPayment(){
  if(!cart.length)return alert('Cart kosong!');
  currentTotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('qrTotal').textContent=currentTotal.toFixed(2);
  document.getElementById('qrModal').style.display='block';
}
function confirmQRPayment(){saveSale('QR');closeModal('qrModal');}

function saveSale(method,received){
  let sale={id:Date.now(),date:new Date().toLocaleString('ms-MY'),timestamp:Date.now(),method:method,items:cart.slice(),total:currentTotal,received:received||null};
  let sales=JSON.parse(localStorage.getItem('denyanya_sales')||'[]');
  sales.unshift(sale);
  localStorage.setItem('denyanya_sales',JSON.stringify(sales));
  let msg='Jualan berjaya!\nKaedah: '+method+'\nJumlah: RM '+currentTotal.toFixed(2);
  if(received)msg+='\nDiterima: RM '+received.toFixed(2)+'\nBaki: RM '+(received-currentTotal).toFixed(2);
  alert(msg);
  cart=[];updateCart();
}

function showHistory(){
  let sales=JSON.parse(localStorage.getItem('denyanya_sales')||'[]');
  let now=new Date(),todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  let today=0,month=0,all=0,cash=0,qr=0,cashToday=0,qrToday=0;
  for(let i=0;i<sales.length;i++){
    let s=sales[i];
    all+=s.total;
    if(s.timestamp>=todayStart)today+=s.total;
    if(s.timestamp>=monthStart)month+=s.total;
    if(s.method==='Cash'){cash+=s.total;if(s.timestamp>=todayStart)cashToday+=s.total;}
    if(s.method==='QR'){qr+=s.total;if(s.timestamp>=todayStart)qrToday+=s.total;}
  }
  document.getElementById('sumToday').textContent='RM '+today.toFixed(2);
  document.getElementById('sumMonth').textContent='RM '+month.toFixed(2);
  document.getElementById('sumAll').textContent='RM '+all.toFixed(2);
  document.getElementById('sumCash').textContent='RM '+cash.toFixed(2);
  document.getElementById('sumQR').textContent='RM '+qr.toFixed(2);
  document.getElementById('sumCashToday').textContent='RM '+cashToday.toFixed(2);
  document.getElementById('sumQRToday').textContent='RM '+qrToday.toFixed(2);

  // Group by date
  let groups={};
  for(let i=0;i<sales.length;i++){
    let s=sales[i];
    let d=new Date(s.timestamp);
    let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let label=d.toLocaleDateString('ms-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    if(!groups[key])groups[key]={label:label,total:0,sales:[]};
    groups[key].total+=s.total;
    groups[key].sales.push(s);
  }

  let list=document.getElementById('historyList');
  let keys=Object.keys(groups).sort().reverse();
  if(!keys.length){list.innerHTML='<div class="empty">Belum ada jualan</div>';}
  else{
    let html='';
    for(let k=0;k<keys.length;k++){
      let g=groups[keys[k]];
      let salesHtml='';
      for(let j=0;j<g.sales.length;j++){
        let s=g.sales[j],items='';
        for(let m=0;m<s.items.length;m++)items+=s.items[m].name+' x'+s.items[m].qty+(m<s.items.length-1?', ':'');
        let time=new Date(s.timestamp).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
        salesHtml+='<div class="sale-item"><div class="top"><div><strong>'+time+'</strong> • '+s.method+' • RM '+s.total.toFixed(2)+(s.received?'<br><small>Diterima: RM '+s.received.toFixed(2)+'</small>':'')+'<br><small>'+items+'</small></div><button class="btn-del" onclick="deleteSale('+s.id+')">Padam</button></div></div>';
      }
      html+='<div class="date-folder"><div class="date-header" onclick="toggleDate(this)"><span>'+g.label+' • RM '+g.total.toFixed(2)+'</span><span class="arrow">▶</span></div><div class="date-sales">'+salesHtml+'</div></div>';
    }
    list.innerHTML=html;
  }
  document.getElementById('historyModal').style.display='block';
}
function toggleDate(el){
  el.classList.toggle('open');
  let sales=el.nextElementSibling;
  sales.classList.toggle('show');
}
function deleteSale(id){if(!confirm('Padam?'))return;let sales=JSON.parse(localStorage.getItem('denyanya_sales')||'[]').filter(s=>s.id!==id);localStorage.setItem('denyanya_sales',JSON.stringify(sales));showHistory();}
function clearAllSales(){if(!confirm('Padam semua?'))return;localStorage.setItem('denyanya_sales','[]');showHistory();}

function showProductManager(){editingId=null;document.getElementById('prodName').value='';document.getElementById('prodPrice').value='';renderProductList();document.getElementById('productModal').style.display='block';}
function renderProductList(){
  let html='';
  for(let i=0;i<products.length;i++){
    let p=products[i];
    html+='<div class="product-edit-item"><div class="top"><div><strong>'+p.name+'</strong><br>RM '+p.price.toFixed(2)+'</div><div><button class="btn-del" style="background:#2980b9;margin-right:6px" onclick="editProduct('+p.id+')">Edit</button><button class="btn-del" onclick="deleteProduct('+p.id+')">Padam</button></div></div></div>';
  }
  document.getElementById('productList').innerHTML=html;
}
function saveProduct(){
  let name=document.getElementById('prodName').value.trim(),price=parseFloat(document.getElementById('prodPrice').value);
  if(!name||isNaN(price)||price<0)return alert('Masukkan nama & harga betul');
  if(editingId){let p=products.find(x=>x.id===editingId);if(p){p.name=name;p.price=price;}}
  else{let newId=products.length?Math.max(...products.map(p=>p.id))+1:1;products.push({id:newId,name:name,price:price});}
  localStorage.setItem('denyanya_products',JSON.stringify(products));
  renderProducts();renderProductList();editingId=null;
  document.getElementById('prodName').value='';document.getElementById('prodPrice').value='';
  alert('Berjaya!');
}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;editingId=id;document.getElementById('prodName').value=p.name;document.getElementById('prodPrice').value=p.price;}
function deleteProduct(id){if(!confirm('Padam produk?'))return;products=products.filter(p=>p.id!==id);localStorage.setItem('denyanya_products',JSON.stringify(products));renderProducts();render
